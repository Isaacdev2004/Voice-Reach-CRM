      action: "send_email",
      subject: "{{city}} real estate update — what's selling near {{property_address}}",
      body: "Neighborhood stats email with recent sold comps",
      condition: "visitor_has_not_replied == true"
    },
    {
      day: 7,
      action: "create_call_task",
      note: "Call {{first_name}} — open house follow-up, qualify buyer intent"
    }
  ],

  segmentationLogic: {
    if_replies_interested: "move_to_active_buyer_sequence",
    if_replies_just_looking: "move_to_long_term_nurture",
    if_replies_has_home_to_sell: "move_to_seller_valuation_sequence",
    if_no_reply_after_day7: "tag_cold_lead_quarterly_touch"
  }
};`,
    tip: { text: 'Use Spacio or Open Home Pro for digital sign-ins — they auto-sync to your CRM and trigger this flow instantly. Paper sign-in sheets kill speed-to-follow-up.', color: '#0F6E56', bg: '#E1F5EE' }
  }
];

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.innerHTML = '<i class="ti ti-copy" aria-hidden="true"></i> Copy'; }, 1800);
  });
}

function renderCampaigns() {
  const container = document.getElementById('campaigns');
  campaigns.forEach((c, idx) => {
    const card = document.createElement('div');
    card.className = 'campaign-card';
    card.innerHTML = `
      <button class="card-trigger" onclick="toggleCard('${c.id}', this)" aria-expanded="false">
        <div class="camp-icon" style="background:${c.iconBg}">
          <i class="ti ${c.icon}" style="color:${c.iconColor}" aria-hidden="true"></i>
        </div>
        <div class="camp-meta">
          <h3>${c.title}</h3>
          <p>${c.desc}</p>
        </div>
        <span class="camp-badge" style="background:${c.badgeBg};color:${c.badgeColor}">${c.badge}</span>
        <i class="ti ti-chevron-down chevron" aria-hidden="true"></i>
      </button>
      <div class="card-body" id="body-${c.id}">
        <div class="flow-strip">
          ${c.flow.map((f, i) => `
            <span class="flow-node" style="background:${f.color};color:${f.tc}">${f.label}</span>
            ${i < c.flow.length - 1 ? '<span class="flow-arrow">→</span>' : ''}
          `).join('')}
        </div>
        <div class="tab-bar" id="tabs-${c.id}">
          <button class="tab-btn active" onclick="switchTab('${c.id}','stats',this)">Overview</button>
          <button class="tab-btn" onclick="switchTab('${c.id}','email',this)">Email copy</button>
          <button class="tab-btn" onclick="switchTab('${c.id}','sms',this)">SMS copy</button>
          <button class="tab-btn" onclick="switchTab('${c.id}','logic',this)">Logic code</button>
        </div>
        <div class="tab-content active" id="${c.id}-stats">
          <div class="stats-row">
            ${c.stats.map(s => `<div class="stat-card"><div class="stat-num">${s.n}</div><div class="stat-lbl">${s.l}</div></div>`).join('')}
          </div>
          <p class="section-label">Automation sequence</p>
          <div style="font-size:13px;color:var(--color-text-secondary);line-height:1.6;">
            ${c.flow.map((f, i) => `<span style="display:inline-block;margin-right:4px;">${i+1}. ${f.label}${i < c.flow.length-1 ? ' →' : ''}</span>`).join(' ')}
          </div>
          <div class="tip-box" style="border-left-color:${c.tip.color};background:${c.tip.bg};color:${c.iconColor}">
            <strong>Pro tip:</strong> ${c.tip.text}
          </div>
        </div>
        <div class="tab-content" id="${c.id}-email">
          <p class="section-label">Subject line</p>
          <div class="code-block" style="margin-bottom:10px;position:relative">
            <button class="copy-btn" onclick="copyText(${JSON.stringify(c.email.subject)}, this)"><i class="ti ti-copy" aria-hidden="true"></i> Copy</button>${c.email.subject}</div>
          <p class="section-label">Email body</p>
          <div class="code-block" style="position:relative">
            <button class="copy-btn" onclick="copyText(${JSON.stringify(c.email.body)}, this)"><i class="ti ti-copy" aria-hidden="true"></i> Copy</button>${c.email.body}</div>
        </div>
        <div class="tab-content" id="${c.id}-sms">
          <p class="section-label">SMS script (160 char friendly)</p>
          <div class="code-block" style="position:relative">
            <button class="copy-btn" onclick="copyText(${JSON.stringify(c.sms)}, this)"><i class="ti ti-copy" aria-hidden="true"></i> Copy</button>${c.sms}</div>
          <div class="tip-box" style="border-left-color:var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary);margin-top:10px;">
            All SMS templates include opt-out language. Confirm A2P 10DLC registration with your SMS platform before sending at volume.
          </div>
        </div>
        <div class="tab-content" id="${c.id}-logic">
          <p class="section-label">Automation logic (JSON/JS — platform-agnostic)</p>
          <div class="code-block" style="position:relative">
            <button class="copy-btn" onclick="copyText(${JSON.stringify(c.logic)}, this)"><i class="ti ti-copy" aria-hidden="true"></i> Copy</button>${c.logic}</div>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

function toggleCard(id, btn) {
  const body = document.getElementById('body-' + id);
  const chevron = btn.querySelector('.chevron');
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  chevron.classList.toggle('open', !isOpen);
  btn.setAttribute('aria-expanded', String(!isOpen));
}

function switchTab(campId, tabName, clickedBtn) {
  const tabBar = document.getElementById('tabs-' + campId);
  tabBar.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  clickedBtn.classList.add('active');
  ['stats','email','sms','logic'].forEach(t => {
    const el = document.getElementById(campId + '-' + t);
    if (el) el.classList.toggle('active', t === tabName);
  });
}

renderCampaigns();
</script>
