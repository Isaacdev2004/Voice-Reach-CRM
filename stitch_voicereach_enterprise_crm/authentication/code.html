</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-secondary hover:underline transition-all" href="#">Forgot?</a>
</div>
<div class="relative">
<input class="w-full h-[56px] px-sm rounded-full border border-outline-variant bg-white focus:ring-2 focus:ring-secondary/20 focus:border-secondary transition-all outline-none font-body-md text-body-md text-ink placeholder:text-outline" id="password" placeholder="••••••••" type="password"/>
</div>
</div>

<button class="w-full h-[56px] bg-primary text-white rounded-full font-label-md text-label-md font-bold hover:bg-secondary transition-all active:scale-[0.98] mt-sm shadow-md" type="submit">
                    Sign In
                </button>

<div aria-hidden="true" class="absolute inset-0 flex items-center">

<div class="relative flex justify-center text-label-md">
