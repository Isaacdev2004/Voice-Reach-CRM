name: ISV isolation
on:
  pull_request:
    paths:
      - 'lib/messaging/**'
      - 'lib/providers/**'
      - 'app/api/messaging/**'
      - 'app/api/webhooks/twilio/**'
      - 'scripts/isv*'
      - 'scripts/isv/**'
      - 'supabase/migrations/*isv*'
      - '.github/workflows/isv-isolation.yml'
permissions:
  contents: read
jobs:
  postgres-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: myari_isv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/isv/postgres-concurrency.cjs
        env:
          MYARI_ISV_POSTGRES_TEST: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: myari_isv_test
          PGPASSWORD: synthetic_ci_only
      - run: npm run test:isv
